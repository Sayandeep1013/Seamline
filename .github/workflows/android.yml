name: Android

# Native builds happen here, never on the owner's PC (GAME_PLAN §10.5).
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      SEAMLINE_VERSION_CODE: ${{ github.run_number }}
      HAS_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v6

      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx cap sync android

      # The permanent release key (GitHub Secrets) signs every build, so updates install over each other.
      - name: Load signing key
        if: env.HAS_KEY == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/seamline.p12"
          echo "SEAMLINE_KEYSTORE=$RUNNER_TEMP/seamline.p12" >> "$GITHUB_ENV"

      - name: Build signed release APK
        if: env.HAS_KEY == 'true'
        working-directory: android
        env:
          SEAMLINE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SEAMLINE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          SEAMLINE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then ./gradlew bundleRelease --no-daemon; fi
          cp app/build/outputs/apk/release/app-release.apk ../app.apk

      - name: Build debug APK (no key available)
        if: env.HAS_KEY != 'true'
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../app.apk

      - name: Verify the signing certificate
        env:
          SEAMLINE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          APKSIGNER=$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}" -path '*build-tools*' -name apksigner -type f | sort -V | tail -1)
          echo "apksigner: $APKSIGNER"
          "$APKSIGNER" verify --print-certs app.apk | tee certs.txt
          if [ "$HAS_KEY" = "true" ]; then
            WANT=$(keytool -list -v -storetype pkcs12 -keystore "$SEAMLINE_KEYSTORE" -storepass "$SEAMLINE_KEYSTORE_PASSWORD"               | grep -m1 'SHA256:' | sed 's/.*SHA256: //; s/://g' | tr 'A-F' 'a-f')
            echo "expected SHA-256: $WANT"
            grep -qi "SHA-256 digest: $WANT" certs.txt && echo "Signed with the Seamline release key."
          fi

      - name: Name the APK
        run: |
          NAME=seamline-${GITHUB_REF_NAME//\//-}.apk
          mv app.apk "$NAME"
          echo "APK=$NAME" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v7
        with:
          name: seamline-apk
          path: ${{ env.APK }}
          retention-days: 30

      - uses: actions/upload-artifact@v7
        if: startsWith(github.ref, 'refs/tags/v') && env.HAS_KEY == 'true'
        with:
          name: seamline-aab
          path: android/app/build/outputs/bundle/release/*.aab
          retention-days: 90

      # A version tag publishes a GitHub Release with the APK attached.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$APK" \
            --title "Seamline $GITHUB_REF_NAME" \
            --notes-file docs/release-notes.md
